<!DOCTYPE html>
<html lang="en" data-color-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Testing Strategy</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.css">

  <style>
    :root {
      --sidebar-width: 300px;
      --bg: #0d1117;
      --bg-elev: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #00A1A1;
      --accent-soft: rgba(0, 161, 161, 0.12);
      --warn: #DC143C;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                   Helvetica, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    /* ---------- Layout ---------- */

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .toc {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-elev);
      border-right: 1px solid var(--border);
      padding: 20px 12px 40px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.45;
      scrollbar-width: thin;
    }

    .toc::-webkit-scrollbar { width: 8px; }
    .toc::-webkit-scrollbar-thumb {
      background: #30363d; border-radius: 4px;
    }

    .toc-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      font-weight: 600;
      margin: 0 8px 12px;
    }

    .toc a {
      display: block;
      color: var(--text-dim);
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 5px;
      border-left: 2px solid transparent;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc a:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }

    .toc a.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .toc a.level-1 {
      font-weight: 700;
      color: var(--text);
      margin-top: 14px;
      font-size: 13.5px;
    }
    .toc a.level-2 { padding-left: 16px; }
    .toc a.level-3 {
      padding-left: 28px;
      font-size: 12.5px;
      color: #6e7681;
    }

    .content {
      flex: 1;
      min-width: 0;
      margin-left: var(--sidebar-width);
      display: flex;
      justify-content: center;
      padding: 0 24px;
    }

    .markdown-body {
      box-sizing: border-box;
      width: 100%;
      max-width: 980px;
      padding: 45px 24px;
      background: transparent;
    }

    /* ---------- Mermaid ---------- */

    .mermaid {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      overflow-x: auto;
    }

    /* ---------- Callout contrast fix for dark bg ---------- */

    .markdown-body [style*="background:rgba(220,20,60"] {
      color: #f0f6fc;
      background: rgba(220, 20, 60, 0.14) !important;
    }
    .markdown-body [style*="background:rgba(0,161,161"] {
      color: #f0f6fc;
      background: rgba(0, 161, 161, 0.14) !important;
    }

    /* ---------- Mobile ---------- */

    .menu-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    @media (max-width: 1024px) {
      .menu-toggle { display: flex; }
      .toc {
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        z-index: 100;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .toc.open { transform: translateX(0); }
      .content { margin-left: 0; padding: 0 16px; }
      .markdown-body { padding: 60px 8px 40px; }
      .backdrop.open { display: block; }
    }

    /* ---------- Back to top ---------- */

    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 80;
      transition: opacity 0.2s, transform 0.2s;
    }
    .back-to-top.visible { display: flex; }
    .back-to-top:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ---------- Loading ---------- */

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-style: italic;
    }
  </style>
</head>
<body>

  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Table of contents">
      <div class="toc-title">On this page</div>
      <!-- TOC items injected here -->
    </nav>

    <main class="content">
      <article id="content" class="markdown-body">
        <div class="loading">Loading strategy…</div>
      </article>
    </main>
  </div>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    /* -----------------------------------------------------------
       1. Slugify — matches GitHub's header anchor format
       ----------------------------------------------------------- */
    function slugify(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')   // keep letters, numbers, spaces, hyphens
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function uniqueSlug(base, used) {
      if (!used.has(base)) { used.add(base); return base; }
      let i = 1;
      while (used.has(base + '-' + i)) i++;
      const slug = base + '-' + i;
      used.add(slug);
      return slug;
    }

    /* -----------------------------------------------------------
       2. Add IDs to headings in rendered HTML
       ----------------------------------------------------------- */
    function addHeadingIds(root) {
      const used = new Set();
      const headings = root.querySelectorAll('h1, h2, h3');
      headings.forEach((h) => {
        const base = slugify(h.textContent);
        const id = uniqueSlug(base || 'section', used);
        h.id = id;
      });
    }

    /* -----------------------------------------------------------
       3. Build TOC from headings
       ----------------------------------------------------------- */
    function buildToc(root, tocEl) {
      const headings = root.querySelectorAll('h1, h2, h3');
      const frag = document.createDocumentFragment();

      headings.forEach((h) => {
        const level = parseInt(h.tagName.substring(1), 10);
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = 'level-' + level;
        a.dataset.target = h.id;

        a.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById(h.id);
          if (!target) return;
          // Offset so heading isn't flush against the top
          const y = target.getBoundingClientRect().top + window.pageYOffset - 16;
          window.scrollTo({ top: y, behavior: 'smooth' });
          history.replaceState(null, '', '#' + h.id);
          closeMobileToc();
        });

        frag.appendChild(a);
      });

      tocEl.appendChild(frag);
    }

    /* -----------------------------------------------------------
       4. Active-section highlighting (scroll based)
       ----------------------------------------------------------- */
    function initScrollSpy(root, tocEl) {
      const headings = Array.from(root.querySelectorAll('h1, h2, h3'));
      const links = new Map();
      tocEl.querySelectorAll('a[data-target]').forEach((a) => {
        links.set(a.dataset.target, a);
      });

      function updateActive() {
        const scrollY = window.pageYOffset;
        const offset = 120; // px from top
        let current = headings[0];

        for (const h of headings) {
          const top = h.getBoundingClientRect().top + scrollY;
          if (top - offset <= scrollY) current = h;
          else break;
        }

        links.forEach((a) => a.classList.remove('active'));
        const activeLink = links.get(current.id);
        if (activeLink) {
          activeLink.classList.add('active');
          // Keep active link visible inside the sidebar
          const linkRect = activeLink.getBoundingClientRect();
          const tocRect = tocEl.getBoundingClientRect();
          if (linkRect.top < tocRect.top || linkRect.bottom > tocRect.bottom) {
            activeLink.scrollIntoView({ block: 'nearest' });
          }
        }
      }

      let ticking = false;
      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            updateActive();
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener('resize', updateActive);
      updateActive();
    }

    /* -----------------------------------------------------------
       5. Mobile TOC drawer
       ----------------------------------------------------------- */
    const tocEl = document.getElementById('toc');
    const menuToggle = document.getElementById('menuToggle');
    const backdrop = document.getElementById('backdrop');

    function openMobileToc() {
      tocEl.classList.add('open');
      backdrop.classList.add('open');
    }
    function closeMobileToc() {
      tocEl.classList.remove('open');
      backdrop.classList.remove('open');
    }

    menuToggle.addEventListener('click', () => {
      tocEl.classList.contains('open') ? closeMobileToc() : openMobileToc();
    });
    backdrop.addEventListener('click', closeMobileToc);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobileToc();
    });

    /* -----------------------------------------------------------
       6. Back-to-top button
       ----------------------------------------------------------- */
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 600) backToTop.classList.add('visible');
      else backToTop.classList.remove('visible');
    }, { passive: true });

    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* -----------------------------------------------------------
       7. Mermaid init
       ----------------------------------------------------------- */
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      themeVariables: {
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif',
        fontSize: '14px'
      }
    });

    /* -----------------------------------------------------------
       8. Render everything
       ----------------------------------------------------------- */
    async function render() {
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('./README.md', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();

        contentEl.innerHTML = marked.parse(md, { gfm: true, breaks: false });

        // Convert ```mermaid code blocks to renderable divs
        contentEl.querySelectorAll('code.language-mermaid').forEach((codeEl) => {
          const pre = codeEl.closest('pre');
          const src = codeEl.textContent;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = src;
          pre.replaceWith(div);
        });

        // Add IDs to headings, build TOC, enable scrollspy
        addHeadingIds(contentEl);
        buildToc(contentEl, tocEl);
        initScrollSpy(contentEl, tocEl);

        // Render all mermaid diagrams
        await mermaid.run({ querySelector: '.mermaid' });

        // If arriving with a hash in the URL, jump to it
        if (location.hash) {
          const target = document.querySelector(location.hash);
          if (target) {
            setTimeout(() => {
              const y = target.getBoundingClientRect().top + window.pageYOffset - 16;
              window.scrollTo({ top: y, behavior: 'instant' });
            }, 50);
          }
        }

      } catch (err) {
        contentEl.innerHTML =
          '<p style="color:#f85149;">Failed to load content: ' +
          err.message + '</p>';
        console.error(err);
      }
    }

    render();
  </script>
</body>
</html>
